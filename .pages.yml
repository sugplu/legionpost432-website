        label: Names by year
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year}"
        fields:
          - name: year
            label: Year
            type: string
            description: "Add the newest year at the top."
          - name: names
            label: Names (Last, First)
            type: string
            list: true

  - name: sponsors
    label: "Picnic sponsors"
    type: file
    path: content/sponsors.json
    format: json
    fields:
      - name: heading
        label: Heading
        type: string
        description: "Example: Thank you to our 2027 Picnic in the Park sponsors"
      - name: sponsors
        label: Sponsors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name} ({fields.level})"
        fields:
          - name: name
            label: Sponsor name
            type: string
            required: true
          - name: level
            label: Level
            type: select
            options:
              values: [Commodore, Patriot, Eagle, Minuteman, Friend]
          - name: logo
            label: Logo (optional)
            type: image
            options:
              media: sponsors
          - name: url
            label: Website (optional)
            type: string

